{% extends "base.html" %}
{% block title %}MallLite - 登录{% endblock %}

{% block content %}
<div class="container">
    <div class="form-container" id="login-form">
        <h2>用户登录</h2>

        {% if error %}
        <div class="error-msg" id="error-msg">{{ error }}</div>
        {% endif %}

        <form method="post" action="/login">
            <div class="form-group">
                <label for="username">用户名</label>
                <input type="text" id="username" name="username" placeholder="请输入用户名"
                       value="{{ username if username else '' }}" required>
            </div>
            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" name="password" placeholder="请输入密码" required>
            </div>
            <div class="form-group">
                <label class="checkbox-label">
                    <input type="checkbox" id="remember" name="remember"> 记住密码
                </label>
            </div>
            <button type="submit" id="login-btn" class="btn-primary">登录</button>
        </form>
        <p class="form-footer">测试账号：admin / admin123</p>
    </div>
</div>
{% endblock %}
