[pytest]
testpaths = test_cases
addopts = -v --tb=short --strict-markers --alluredir=allure-results

markers =
    smoke: 冒烟测试
    regression: 回归测试
    login: 登录接口
    register: 注册接口
    product: 商品接口
    category: 分类接口
    cart: 购物车接口
    order: 订单接口
    positive: 正向用例
    negative: 反向用例
    schema: Schema 校验用例
    p0: 最高优先级
    p1: 高优先级
    p2: 中优先级

log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s | %(levelname)-8s | %(name)-12s | %(message)s
log_cli_date_format = %H:%M:%S